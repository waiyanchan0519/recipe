name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" docs/app-release.apk \
            --title "美味食譜 RecipeApp ${{ github.ref_name }}" \
            --notes "### 🍳 美味食譜 (RecipeApp) Android 正式發行版 ${{ github.ref_name }}

          感謝下載「美味食譜」Android 原生 App！

          #### ✨ 核心特色
          - 🍽️ 精選中西日韓 8 道經典料理探索與搜尋
          - ⚖️ 智慧份量換算（1~20 人份即時動態縮放食材用量）
          - ⏱️ 內建料理步驟專屬計時器（支援背景倒數與震動提醒）
          - 🛒 超市備料採買清單與 ❤️ 離線收藏夾
          - 🎨 Material 3 陶土橘暖色調食慾主題（支援深淺色模式切換）

          #### 📥 安裝說明
          1. 點擊下方 Assets 中的 \`app-release.apk\` 下載至手機。
          2. 若系統提示「是否允許安裝未知來源應用程式」，點選允許。
          3. 完成安裝後即可開啟體驗！"
